  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

(--ink); transition:background 0.4s ease, color 0.4s ease;\">\n\n  <!-- HEADER -->\n  <header ref=\"{{ headerRef }}\" style=\"position:sticky; top:0; z-index:100; display:flex; align-items:center; justify-content:space-between; padding:1.15rem clamp(1.25rem,4vw,3rem); background:var(--paper); border-bottom:1px solid var(--line); transition:padding 0.3s ease, background 0.4s ease;\">\n    <a href=\"#top\" class=\"ms\" style=\"font-size:1.2rem; letter-spacing:0; display:flex; align-items:center; gap:0.35em;\">\n      <span style=\"font-weight:700; font-style:italic;\">Unsigned<\u002Fspan><span style=\"font-weight:400; font-style:italic;\">Research<\u002Fspan>\n    <\u002Fa>\n    <nav ref=\"{{ menuRef }}\" class=\"mono\" style=\"display:flex; align-items:center; gap:2rem; font-size:0.72rem; letter-spacing:0.14em; text-transform:uppercase; font-weight:600;\">\n      <a href=\"#firm\" onclick=\"{{ closeMenu }}\">Firm<\u002Fa>\n      <a href=\"#strategy\" onclick=\"{{ closeMenu }}\">Strategy<\u002Fa>\n      <a href=\"#platform\" onclick=\"{{ closeMenu }}\">Platform<\u002Fa>\n      <a href=\"#risk\" onclick=\"{{ closeMenu }}\">Risk<\u002Fa>\n      <a href=\"#team\" onclick=\"{{ closeMenu }}\">Team<\u002Fa>\n      <a href=\"#connect\" onclick=\"{{ closeMenu }}\" style=\"border:1px solid var(--line); padding:0.55rem 1.1rem;\">Enquiries<\u002Fa>\n    <\u002Fnav>\n    <div style=\"display:flex; align-items:center; gap:0.75rem;\">\n      <button onclick=\"{{ toggleTheme }}\" aria-label=\"Toggle colour theme\" style=\"cursor:pointer; background:transparent; border:1px solid var(--line); width:38px; height:38px; display:flex; align-items:center; justify-content:center;\">\n        <span ref=\"{{ themeIconRef }}\" style=\"width:15px; height:15px; border-radius:50%; border:1.5px solid var(--ink); background:linear-gradient(90deg, var(--ink) 0 50%, transparent 50% 100%); display:block; transition:transform 0.4s cubic-bezier(0.16,1,0.3,1);\"><\u002Fspan>\n      <\u002Fbutton>\n 25rem); font-size:0.72rem; letter-spacing:0.1em; text-transform:uppercase; border-bottom:1px solid var(--ink); padding-bottom:0.4rem;\">Contact the partners' office →<\u002Fa>\n    <\u002Fdiv>\n    <div data-reveal=\"\" class=\"mono\" style=\"position:relative; z-index:1; width:100%; max-width:1240px; margin:0 auto; display:flex; justify-content:center; align-items:center; padding:0 clamp(1.25rem,4vw,3rem) 1.7rem; font-size:0.7rem; letter-spacing:0.14em; text-transform:uppercase;\">\n      <a href=\"#firm\">Scroll ↓<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- STATS (inverse band) -->\n  <section style=\"background:var(--inv-bg); color:var(--inv-ink); transition:background 0.4s ease, color 0.4s ease;\">\n    <div style=\"max-width:1240px; margin:0 auto; padding:clamp(2.75rem,5vw,4rem) clamp(1.25rem,4vw,3rem);\">\n      <div data-reveal=\"\" class=\"mono\" style=\"font-size:0.72rem; letter-spacing:0.16em; font-weight:600; margin-bottom:clamp(1.5rem,3vw,2.25rem);\">AT A GLANCE<\u002Fdiv>\n      <div ref=\"{{ statsRef }}\" class=\"stats-grid\" style=\"display:grid; grid-template-columns:repeat(4,1fr); gap:0; border-top:1px solid var(--inv-line);\">\n        <sc-for list=\"{{ stats }}\" as=\"s\" hint-placeholder-count=\"4\">\n          <div data-reveal=\"\" style=\"padding:1.75rem 1.5rem 0 0;\">\n            <div class=\"stat-val\" data-count=\"{{ s.value }}\" style=\"font-size:clamp(2.2rem,4.2vw,3.6rem); font-weight:500; line-height:1; letter-spacing:-0.025em;\">{{ s.value }}<\u002Fdiv>\n            <div class=\"mono\" style=\"font-size:0.72rem; letter-spacing:0.1em; text-transform:uppercase; margin-top:0.9rem;\">{{ s.label }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 00 FIRM -->\n  <section id=\"firm\" style=\"max-width:1240px; margin:0 auto; padding:clamp(3.5rem,7vw,6.5rem) clamp(1.25rem,4vw,3rem); border-top:1px solid var(--line);\">\n    <div class=\"split\" style=\"display:grid; grid-template-columns:0.5fr 1.5fr; gap:clamp(1.5rem,5vw,4rem);\">\n      <div data-reveal=\"\">\n        <span class=\"mono\" style=\"font-size:0.72rem; letter-spacing:0.16em; font-weight:600;\">00 / THE FIRM<\u002Fspan>\n      <\u002Fdiv>\n      <div>\n        <h2 data-reveal=\"\" style=\"font-size:clamp(1.9rem,3.6vw,3rem); font-weight:400; line-height:1.15; letter-spacing:-0.01em; max-width:34ch;\">\n          One integrated platform for<br><span class=\"firm-phrase\" style=\"font-style:italic;\">research, execution, and risk.<\u002Fspan>\n        <\u002Fh2>\n        <p data-reveal=\"\" style=\"margin-top:1.75rem; font-size:1.12rem; line-height:1.75; max-width:62ch;\">\n          Unsigned Research is a proprietary trading firm running medium-frequency, quantitatively engineered strategies. We unite quantitative scientists, engineers, and risk professionals — with backgrounds in high-performance computing, doctoral research, and institutional trading — and treat strategy research, software engineering, and operations as a single discipline.\n        <\u002Fp>\n        <div class=\"pillars\" style=\"display:grid; grid-template-columns:repeat(3,1fr); gap:0; margin-top:clamp(2.5rem,5vw,3.5rem); border-top:1px solid var(--line);\">\n          <div data-reveal=\"\" style=\"padding:1.75rem 1.5rem 1.75rem 0; border-right:1px solid var(--hair);\">\n            <div class=\"mono\" style=\"font-size:0.72rem; margin-bottom:0.9rem;\">01<\u002Fdiv>\n            <h3 style=\"font-size:1.2rem; font-weight:700; margin-bottom:0.6rem;\">Systematic Alpha<\u002Fh3>\n            <p style=\"font-size:0.98rem; line-height:1.6;\">Regime-tested strategies built through systematic validation and repeatable scientific process.<\u002Fp>\n          <\u002Fdiv>\n          <div data-reveal=\"\" style=\"padding:1.75rem 1.5rem; border-right:1px solid var(--hair);\">\n            <div class=\"mono\" style=\"font-size:0.72rem; margin-bottom:0.9rem;\">02<\u002Fdiv>\n            <h3 style=\"font-size:1.2rem; font-weight:700; margin-bottom:0.6rem;\">Integrated Infrastructure<\u002Fh3>\n            <p style=\"font-size:0.98rem; line-height:1.6;\">A vertically integrated platform from research to portfolio construction to execution.<\u002Fp>\n          <\u002Fdiv>\n          <div data-reveal=\"\" style=\"padding:1.75rem 0 1.75rem 1.5rem;\">\n            <div class=\"mono\" style=\"font-size:0.72rem; margin-bottom:0.9rem;\">03<\u002Fdiv>\n            <h3 style=\"font-size:1.2rem; font-weight:700; margin-bottom:0.6rem;\">Risk Surveillance<\u002Fh3>\n            <p style=\"font-size:0.98rem; line-height:1.6;\">Stress testing, continuous monitoring, and automated alerts across the trading lifecycle.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 02 STRATEGY -->\n  <section id=\"strategy\" style=\"max-width:1240px; margin:0 auto; padding:clamp(3rem,7vw,6rem) clamp(1.25rem,4vw,3rem); border-top:1px solid var(--line);\">\n    <div class=\"split\" style=\"display:grid; grid-template-columns:0.5fr 1.5fr; gap:clamp(1.5rem,5vw,4rem);\">\n      <div data-reveal=\"\">\n        <span class=\"mono\" style=\"font-size:0.72rem; letter-spacing:0.16em; font-weight:600;\">01 / STRATEGY<\u002Fspan>\n      <\u002Fdiv>\n      <div>\n        <h2 data-reveal=\"\" style=\"font-size:clamp(1.9rem,3.6vw,3rem); font-weight:400; line-height:1.15; letter-spacing:-0.01em; max-width:20ch;\">\n          Robust by design, <span style=\"font-style:italic;\">risk-aware at every stage.<\u002Fspan>\n        <\u002Fh2>\n        <div data-reveal=\"\" style=\"margin-top:1.75rem; max-width:64ch; display:flex; flex-direction:column; gap:1.15rem;\">\n          <p style=\"font-size:1.12rem; line-height:1.75;\">We operate systematic strategies across a range of risk profiles, liquidity needs, and allocation objectives.<\u002Fp>\n          <p style=\"font-size:1.12rem; line-height:1.75;\">Our flagship program is a high-capacity, market-neu -transform:uppercase; color:var(--red); margin-top:1.75rem; padding-top:1.1rem; border-top:1px solid var(--line);\">No Advice<\u002Fh3>\n            <p style=\"margin-top:0.9rem; font-size:0.98rem; line-height:1.7;\">Nothing on this site constitutes investment, legal, tax, or other professional advice. Any reliance you place on the information is strictly at your own risk.<\u002Fp>\n\n            <h3 class=\"mono\" style=\"font-size:0.72rem; letter-spacing:0.14em; text-transform:uppercase; color:var(--red); margin-top:1.75rem; padding-top:1.1rem; border-top:1px solid var(--line);\">Intellectual Property<\u002Fh3>\n            <p style=\"margin-top:0.9rem; font-size:0.98rem; line-height:1.7;\">All content, marks, and materials on this site are the property of Unsigned Research Ltd. and may not be reproduced without prior written permission.<\u002Fp>\n\n            <h3 class=\"mono\" style=\"font-size:0.72rem; letter-spacing:0.14em; text-transform:uppercase; color:var(--red); margin-top:1.75rem; padding-top:1.1rem; border-top:1px solid var(--line);\">Governing Law<\u002Fh3>\n            <p style=\"margin-top:0.9rem; font-size:0.98rem; line-height:1.7;\">These terms, and the site's availability, are governed by the laws of England and Wales. We may change, suspend, or withdraw any part of the site at any time without notice.<\u002Fp>\n\n            <p style=\"margin-top:1.75rem; padding-top:1.1rem; border-top:1px solid var(--line); font-size:0.98rem; line-height:1.7;\">Questions? Contact <a href=\"mailto:enquiries@unsigned-research.com\" style=\"border-bottom:1px solid var(--ink);\">enquiries@unsigned-research.com<\u002Fa>.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  \n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:900}}\">\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.rootRef = React.createRef();\n    this.headerRef = React.createRef();\n    this.menuRef = React.createRef();\n    this.menuBtnRef = React.createRef();\n    this.walkRef = React.createRef();\n    this.statsRef = React.createRef();\n    this.themeIconRef = React.createRef();\n    this._menuOpen = false;\n    this.state = { legal: null };\n  }\n\n  componentDidMount() {\n    let saved = null;\n    try { saved = localStorage.getItem('unsigned-theme'); } catch (e) {}\n    if (!saved) {\n      saved = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';\n    }\n    this._applyTheme(saved);\n\n    const root = this.rootRef.current;\n    if (root) {\n      const els = Array.from(root.querySelectorAll('[data-reveal]'));\n      els.forEach((el) => {\n        el.style.opacity = '0';\n        el.style.transform = 'translateY(20px)';\n        el.style.transition = 'opacity 0.7s cubic-bezier(0.16,1,0.3,1), transform 0.7s cubic-bezier(0.16,1,0.3,1)';\n        el._revealed = false;\n      });\n      const reveal = (el) => {\n        if (el._revealed) return;\n        el._revealed = true;\n        el.style.opacity = '1';\n        el.style.transform = 'translateY(0)';\n      };\n      this._checkReveal = () => {\n        const vh = window.innerHeight || 800;\n        els.forEach((el) => {\n          if (el._revealed) return;\n          const r = el.getBoundingClientRect();\n          if (r.top < vh * 0.92 && r.bottom > 0) reveal(el);\n        });\n      };\n      requestAnimationFrame(() => { this._checkReveal(); requestAnimationFrame(this._checkReveal); });\n      window.addEventListener('scroll', this._checkReveal, { passive: true });\n      document.addEventListener('scroll', this._checkReveal, { passive: true, capture: true });\n      window.addEventListener('resize', this._checkReveal, { passive: true });\n      setTimeout(() => els.forEach(reveal), 2200);\n    }\n\n    this._mq = window.matchMedia('(max-width: 860px)');\n    this._syncMenu = () => this._layoutMenu();\n    this._mq.addEventListener ? this._mq.addEventListener('change', this._syncMenu) : this._mq.addListener(this._syncMenu);\n    this._layoutMenu();\n\n    this._onScroll = () => {\n      const h = this.headerRef.current;\n      if (!h) return;\n      if (window.pageYOffset > 20) {\n        h.style.boxShadow = '0 1px 0 var(--line)';\n        h.style.paddingTop = '0.85rem';\n        h.style.paddingBottom = '0.85rem';\n      } else {\n        h.style.boxShadow = 'none';\n        h.style.paddingTop = '1.15rem';\n        h.style.paddingBottom = '1.15rem';\n      }\n    };\n    window.addEventListener('scroll', this._onScroll, { passive: true });\n    this._initWalk();\n\n    this._onKey = (e) => { if (e.key === 'Escape' && this.state.legal) this.setState({ legal: null }); };\n    window.addEventListener('keydown', this._onKey);\n\n    this._initStats();\n    this._initBios();\n    this._bioResize = () => { clearTimeout(this._bioT); this._bioT = setTimeout(() => this._initBios(), 200); };\n    window.addEventListener('resize', this._bioResize);\n  }\n\n  _initBios() {\n    const root = this.rootRef.current;\n    if (!root) return;\n    const ps = Array.from(root.querySelectorAll('.bio'));\n    if (!ps.length) return;\n    const MIN = 0.82, MAX = 0.96, STEP = 0.02;\n    const ACCEPT = 0.86;\n    const meas = document.createElement('span');\n    meas.style.cssText = 'position:absolute; visibility:hidden; white-space:nowrap; left:-9999px; top:0;';\n    document.body.appendChild(meas);\n    const results = ps.map((p) => {\n      const cw = p.clientWidth || 1;\n      const cs = getComputedStyle(p);\n      meas.style.fontFamily = cs.fontFamily;\n      meas.style.fontWeight = cs.fontWeight;\n      meas.textContent = p.textContent;\n      let best = null;\n      for (let fs = MAX; fs >= MIN - 1e-6; fs -= STEP) {\n        meas.style.fontSize = fs + 'rem';\n        const T = meas.getBoundingClientRect().width;\n        const L = Math.max(1, Math.round(T / cw));\n        const fill = T / (L * cw);\n        if (!best || fill > best.fill) best = { fs, fill };\n      }\n      return { p, best };\n    });\n    document.body.removeChild(meas);\n    const worst = Math.min.apply(null, results.map((r) => r.best.fill));\n    if (worst < ACCEPT) {\n      ps.forEach((p) => { p.style.textAlign = 'left'; p.style.fontSize = '0.94rem'; });\n    } else {\n      results.forEach((r) => { r.p.style.textAlign = 'justify'; r.p.style.fontSize = r.best.fs + 'rem'; });\n    }\n  }\n\n  _initStats() {\n    const wrap = this.statsRef.current;\n    if (!wrap) return;\n    const els = Array.from(wrap.querySelectorAll('.stat-val'));\n    const parse = (raw) => {\n      const m = String(raw).match(/([\\d.]+)/);\n      const target = m ? parseFloat(m[1]) : 0;\n      const suffix = raw.slice((m ? (m.index + m[1].length) : 0));\n      const prefix = m ? raw.slice(0, m.index) : '';\n      const decimals = (m && m[1].indexOf('.') >= 0) ? (m[1].split('.')[1].length) : 0;\n      return { target, suffix, prefix, decimals };\n    };\n    const items = els.map((el) => ({ el, ...parse(el.getAttribute('data-count') || el.textContent) }));\n    const fmt = (v, it) => it.prefix + (it.decimals ? v.toFixed(it.decimals) : Math.round(v).toString()) + it.suffix;\n    items.forEach((it) => { it.el.textContent = fmt(0, it); });\n    const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;\n    if (reduce) { items.forEach((it) => { it.el.textContent = fmt(it.target, it); }); return; }\n    let started = false;\n    const run = () => {\n      if (started) return; started = true;\n      const dur = 1100, t0 = performance.now();\n      const ease = (x) => 1 - Math.pow(1 - x, 3);\n      const timer = setInterval(() => {\n        const p = Math.min(1, (performance.now() - t0) / dur), e = ease(p);\n        items.forEach((it) => { it.el.textContent = fmt(it.target * e, it); });\n        if (p >= 1) clearInterval(timer);\n      }, 33);\n    };\n    this._statsCheck = () => {\n      if (started) return;\n      const r = wrap.getBoundingClientRect();\n      if (r.top < (window.innerHeight || 800) * 0.9 && r.bottom > 0) run();\n    };\n    this._statsCheck();\n    window.addEventListener('scroll', this._statsCheck, { passive: true });\n    document.addEventListener('scroll', this._statsCheck, { passive: true, capture: true });\n    setTimeout(run, 4000);\n  }\n\n  _initWalk() {\n    const c = this.walkRef.current;\n    if (!c) return;\n    const ctx = c.getContext('2d');\n    const self = this;\n    let vals = [], W = 0, H = 0, N = 0;\n    const rnd = () => Math.random() + Math.random() + Math.random() - 1.5;\n    const fit = () => {\n      const r = c.getBoundingClientRect();\n      W = c.width = Math.max(2, r.width | 0);\n      H = c.height = Math.max(2, r.height | 0);\n      N = Math.ceil(W / 3) + 4;\n      if (!vals.length) { let v = 0; for (let i = 0; i < N; i++) { v += 0.9 + rnd() * 2.4; vals.push(v); } }\n    };\n    fit();\n    try { this._walkRO = new ResizeObserver(fit); this._walkRO.observe(c); } catch (e) {}\n    const step = () => { vals.push(vals[vals.length - 1] + 0.95 + rnd() * 2.6); while (vals.length > N) vals.shift(); };\n    const draw = () => {\n      if (!W || !H) return;\n      const ink = (getComputedStyle(self.rootRef.current).getPropertyValue('--ink') || '#141416').trim();\n      const lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals), rng = (hi - lo) || 1;\n      const padT = H * 0.24, padB = H * 0.20, usable = H - padT - padB;\n      const yAt = (v) => H - padB - ((v - lo) / rng) * usable;\n      ctx.clearRect(0, 0, W, H);\n      ctx.beginPath();\n      for (let i = 0; i < vals.length; i++) { const x = i / (vals.length - 1) * W; const y = yAt(vals[i]); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }\n      ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.closePath();\n      ctx.fillStyle = ink; ctx.globalAlpha = 0.05; ctx.fill();\n      ctx.beginPath();\n      for (let i = 0; i < vals.length; i++) { const x = i / (vals.length - 1) * W; const y = yAt(vals[i]); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }\n      ctx.strokeStyle = ink; ctx.globalAlpha = 0.28; ctx.lineWidth = 1.4; ctx.stroke();\n      const ly = yAt(vals[vals.length - 1]);\n      ctx.globalAlpha = 1; ctx.fillStyle = '#f05454'; ctx.beginPath(); ctx.arc(W - 1.5, ly, 2.8, 0, 7); ctx.fill();\n    };\n    draw();\n    const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;\n    if (!reduce) this._walkTimer = setInterval(() => { step(); draw(); }, 45);\n  }\n\n  componentWillUnmount() {\n    if (this._bioResize) window.removeEventListener('resize', this._bioResize);\n    if (this._walkTimer) clearInterval(this._walkTimer);\n    if (this._walkRO) this._walkRO.disconnect();\n    if (this._onKey) window.removeEventListener('keydown', this._onKey);\n    if (this._statsCheck) { window.removeEventListener('scroll', this._statsCheck); document.removeEventListener('scroll', this._statsCheck, true); }\n    if (this._onScroll) window.removeEventListener('scroll', this._onScroll);\n    if (this._checkReveal) {\n      window.removeEventListener('scroll', this._checkReveal);\n      document.removeEventListener('scroll', this._checkReveal, true);\n      window.removeEventListener('resize', this._checkReveal);\n    }\n    if (this._mq && this._syncMenu) {\n      this._mq.removeEventListener ? this._mq.removeEventListener('change', this._syncMenu) : this._mq.removeListener(this._syncMenu);\n    }\n  }\n\n  _applyTheme(theme) {\n    const root = this.rootRef.current;\n    if (root) root.setAttribute('data-theme', theme);\n    if (this.themeIconRef.current) this.themeIconRef.current.style.transform = theme === 'dark' ? 'rotate(180deg)' : 'rotate(0deg)';\n    try { localStorage.setItem('unsigned-theme', theme); } catch (e) {}\n  }\n\n  _layoutMenu() {\n    const nav = this.menuRef.current;\n    const btn = this.menuBtnRef.current;\n    if (!nav || !btn) return;\n    const narrow = this._mq && this._mq.matches;\n    if (narrow) {\n      btn.style.display = 'flex';\n      nav.style.position = 'fixed';\n      nav.style.top = '61px';\n      nav.style.left = '0';\n      nav.style.right = '0';\n      nav.style.flexDirection = 'column';\n      nav.style.alignItems = 'center';\n      nav.style.textAlign = 'center';\n      nav.style.gap = '1.25rem';\n      nav.style.padding = '1.75rem clamp(1.25rem,4vw,3rem)';\n      nav.style.background = 'var(--paper)';\n      nav.style.borderBottom = '1px solid var(--line)';\n      nav.style.display = this._menuOpen ? 'flex' : 'none';\n    } else {\n      this._menuOpen = false;\n      btn.style.display = 'none';\n      nav.style.position = 'static';\n      nav.style.flexDirection = 'row';\n      nav.style.alignItems = 'center';\n      nav.style.textAlign = 'left';\n      nav.style.gap = '2rem';\n      nav.style.padding = '0';\n      nav.style.background = 'transparent';\n      nav.style.borderBottom = 'none';\n      nav.style.display = 'flex';\n    }\n  }\n\n  renderVals() {\n    return {\n      rootRef: this.rootRef,\n      walkRef: this.walkRef,\n      statsRef: this.statsRef,\n      themeIconRef: this.themeIconRef,\n      headerRef: this.headerRef,\n      legalOpen: !!this.state.legal,\n      isPrivacy: this.state.legal === 'privacy',\n      isTerms: this.state.legal === 'terms',\n      showPrivacy: (e) => { if (e && e.preventDefault) e.preventDefault(); this.setState({ legal: 'privacy' }); },\n      showTerms: (e) => { if (e && e.preventDefault) e.preventDefault(); this.setState({ legal: 'terms' }); },\n      closeLegal: (e) => { if (e && e.preventDefault) e.preventDefault(); this.setState({ legal: null }); },\n      stop: (e) => { if (e && e.stopPropagation) e.stopPropagation(); },\n      menuRef: this.menuRef,\n      menuBtnRef: this.menuBtnRef,\n      toggleTheme: () => {\n        const cur = this.rootRef.current ? this.rootRef.current.getAttribute('data-theme') : 'light';\n        this._applyTheme(cur === 'dark' ? 'light' : 'dark');\n      },\n      toggleMenu: () => {\n        this._menuOpen = !this._menuOpen;\n        if (this.menuBtnRef.current) this.menuBtnRef.current.textContent = this._menuOpen ? '✕' : '☰';\n        this._layoutMenu();\n      },\n      closeMenu: () => {\n        if (this._menuOpen) {\n          this._menuOpen = false;\n          if (this.menuBtnRef.current) this.menuBtnRef.current.textContent = '☰';\n          this._layoutMenu();\n        }\n      },\n      steps: [\n        { n: '01', title: 'Signals', desc: 'Independent, economically-grounded factors drawn from data the market has yet to price.', risk: 'Each signal is stress-tested across market regimes before it is allowed to trade.' },\n        { n: '02', title: 'Portfolio Construction', desc: 'Long and short balanced to isolate alpha from beta — market-neutral by construction.', risk: 'Exposures are bounded and diversified so no single factor or asset can dominate the book.' },\n        { n: '03', title: 'Execution', desc: 'Cost- and liquidity-aware routing across venues on an owned trading engine.', risk: 'Slippage, liquidity, and counterparty exposure are measured on every fill.' },\n        { n: '04', title: 'Monitoring', desc: 'Live performance and model behaviour watched continuously, around the clock.', risk: 'Automated de-risking and anomaly detection intervene the moment limits are breached.' }\n      ],\n      controls: [\n        { n: '01', title: 'Alpha Diversification', desc: 'We diversify alpha across multiple signals, time horizons, and strategies to reduce dependence on any single source of return.' },\n        { n: '02', title: 'Concentration Control', desc: 'Portfolio construction is designed to avoid excessive exposure to any one asset, factor, venue, or market condition.' },\n        { n: '03', title: 'Adaptive Positioning', desc: 'Position sizing adjusts to changing volatility, liquidity, and signal confidence, keeping risk aligned with market conditions.' },\n        { n: '04', title: 'Live Risk Monitoring', desc: 'Proprietary systems continuously compare live trading against expected behaviour, flagging divergence in real time.' },\n        { n: '05', title: 'Automated Safeguards', desc: 'Anomaly detection and automated controls help protect the book, with alerts routed across critical monitoring channels.' },\n        { n: '06', title: 'Dynamic De-Risking', desc: 'Exposure is reduced during drawdown or stress events and systematically reintroduced as conditions stabilise.' }\n      ],\n      values: [\n        { title: 'Risk Management First', desc: 'Capital deploys only once risks are quantified, bounded, and observed.' },\n        { title: 'First Principles', desc: 'We deconstruct complex systems to fundamentals, then rebuild robustly.' },\n        { title: 'Precision', desc: 'Disciplined scope, every component instrumented for clarity and audit.' },\n        { title: 'Meritocracy', desc: 'The best idea wins, supported by data — precision outweighs tenure.' },\n        { title: 'Future Driven', desc: 'We anticipate structural shifts in microstructure, liquidity, and regulation.' },\n        { title: 'Integrity', desc: 'Transparency, accountability, and fairness across partners and trades.' }\n      ],\n      team: [\n        { name: 'Charles Fried', role: 'Chief Executive Officer', bio: 'Leads firm strategy, partnerships, and portfolio management, bringing experience as a serial software entrepreneur with a track record building deep-tech ventures and scaling technology-led businesses. Focuses on aligning research, infrastructure, capital relationships, and execution into a disciplined institutional platform.', photo: './images/team/aabir.jpg' },\n        { name: 'Alex Nestor Bergmann', role: 'Chief Technology Officer', bio: 'Oversees technology, research infrastructure, and quantitative systems. Brings over a decade of experience in quantitative research, machine learning, and applied mathematics, with a PhD in Applied Mathematics and prior experience as a Research Fellow at the University of Cambridge.', photo: './images/team/alex.jpg' },\n        { name: 'Vincent Drigues', role: 'Chief Financial Officer', bio: 'Oversees finance, treasury, governance, and risk oversight, with experience managing finance and operations across multiple startups. Previously served as CFO of a clinical-stage gene-therapy company and began his career in audit at EY.', photo: './images/team/vincent.jpg' },\n        { name: 'Aabir Fauzan', role: 'Senior Quant', bio: 'Focuses on alpha research, portfolio construction, and live strategy management across systematic programs. Works across signal discovery, model validation, risk calibration, and allocation, translating research into production-ready strategies.', photo: './images/team/charles.jpg' }\n      ],\n      stats: [\n        { value: '5+', label: 'Years live trading' },\n        { value: '10M+', label: 'Data points / day' },\n        { value: '100+', label: 'Data sources' },\n        { value: '24/7', label: 'Programmatic risk controls' }\n      ]\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
